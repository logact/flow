name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package production build
        run: |
          mkdir -p deploy-package
          git archive HEAD | tar -x -C deploy-package
          cp -a .next deploy-package/.next
          tar -czf flow-deploy.tar.gz --exclude=.next/cache -C deploy-package .
      - uses: actions/upload-artifact@v4
        with:
          name: flow-deploy
          path: flow-deploy.tar.gz
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flow-deploy
      - name: Copy build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: flow-deploy.tar.gz
          target: ${{ secrets.DEPLOY_PATH }}
      - name: Activate build over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_REF: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: DEPLOY_PATH,DEPLOY_REF
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            find . -mindepth 1 -maxdepth 1 ! -name .data ! -name .env ! -name node_modules -exec rm -rf {} +
            tar -xzf flow-deploy.tar.gz
            npm ci
            mkdir -p .data
            if command -v pm2 >/dev/null 2>&1; then
              pm2 reload flow --update-env || pm2 start npm --name flow -- start
              pm2 save
            elif command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files flow.service >/dev/null 2>&1; then
              sudo systemctl restart flow
            else
              echo 'Neither PM2 process "flow" nor systemd service "flow" is configured.' >&2
              exit 1
            fi
            rm -f flow-deploy.tar.gz
